services:
  - type: web
    name: hexlands
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Shown in the Terms of Use and Privacy Policy. Render asks for these when you deploy.
      - key: OPERATOR_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Public play (Quick play, public rooms). Keep "off" until you are ready; change it to "on" in the Render dashboard to open the game to everyone.
      - key: PUBLIC_ROOMS
        value: "off"
      # Optional: lets you read chat reports at /api/admin/reports?key=YOUR_KEY
      - key: ADMIN_KEY
        sync: false
