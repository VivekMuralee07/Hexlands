name: Tests

# Runs the whole test suite on every pull request and on every push to main.
# workflow_dispatch adds a "Run workflow" button (Actions tab) to start it by hand, for example when GitHub did not start a run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22   # the leaderboard needs the built-in node:sqlite (Node 22.5 or later)
      # The game itself has no dependencies. Playwright (for the screen tests in ui.test.js) is a dev dependency, and it needs a browser.
      - run: npm ci
      # Installing the browser downloads packages (apt) from the internet. GitHub's network now and then fails to resolve their servers, and apt
      # can hang for minutes. So: apt retries each download, and the whole install gets up to 3 tries of 3 minutes each (it normally takes about one).
      - name: Install the browser for the screen tests
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            timeout 180 npx playwright install --with-deps chromium && exit 0
            echo "Browser install failed (attempt $attempt of 3)."
            sleep 10
          done
          echo "The browser could not be installed. This is a problem with GitHub's network or the package servers, not with the code."
          exit 1
      - run: npm test
