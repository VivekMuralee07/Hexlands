name: Tests

# Runs the whole test suite on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22   # the leaderboard needs the built-in node:sqlite (Node 22.5 or later)
      # The game itself has no dependencies. Playwright (for the screen tests in ui.test.js) is a dev dependency, and it needs a browser.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
