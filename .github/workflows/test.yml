name: Tests

# Runs the whole test suite on every pull request and on every push to main.
# workflow_dispatch adds a "Run workflow" button (Actions tab) to start it by hand, for example when GitHub did not start a run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-24.04   # pinned: a newer ubuntu-latest image can change what is preinstalled
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22   # the leaderboard needs the built-in node:sqlite (Node 22.5 or later)
      # The game itself has no dependencies. Playwright (for the screen tests in ui.test.js) is a dev dependency, and it needs a browser.
      - run: npm ci
      # The screen tests need a browser. GitHub's Ubuntu runners already have Chrome installed, so use that: nothing to download, and no apt, which is
      # the step that fails when GitHub's network cannot reach the Ubuntu package servers (the tests read the browser's location from CHROMIUM_PATH).
      # Only if there is no Chrome is Playwright's own Chromium installed, with retries (up to 3 tries of 3 minutes; it normally takes about one).
      - name: Find or install a browser for the screen tests
        run: |
          for name in google-chrome google-chrome-stable chromium chromium-browser; do
            if path=$(command -v "$name"); then
              echo "Using $path"; "$path" --version
              echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No browser found: installing Playwright's Chromium."
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            timeout 180 npx playwright install --with-deps chromium && exit 0
            echo "Browser install failed (attempt $attempt of 3)."
            sleep 10
          done
          echo "The browser could not be installed. This is a problem with GitHub's network or the package servers, not with the code."
          exit 1
      - run: npm test

  # The native Android app (android-native/): builds it and runs its tests, which start the real Node server and draw the screens on the JVM.
  # Not a required check for merging; it shows whether the Android app still builds.
  android:
    name: android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22   # the Android tests start the game server (node server.js)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # 1. Build the app and keep the APK, before any test runs: a failing test must not stop you from getting the app.
      - name: Build the app
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug
      # The test app, ready to install on a phone: Actions tab, open this run, Artifacts, hexlands-test-apk (a zip with app-debug.apk inside).
      - name: Keep the test app (APK)
        uses: actions/upload-artifact@v4
        with:
          name: hexlands-test-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # 2. The screen tests (Robolectric) need Android runtimes (about 350 MB). Gradle downloads it like any other dependency and Robolectric runs
      # offline from build/robolectric-runtime (see android-native/app/build.gradle.kts). Maven Central answers "429 Too Many Requests" to big downloads
      # from shared build machines now and then, so the download has its own step that tries again (a failed test run is never retried).
      - name: Download the Android runtime for the screen tests
        working-directory: android-native
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --no-daemon -q :app:copyRobolectricRuntime && exit 0
            echo "The download was refused (attempt $attempt of 5). Trying again in 60 seconds."
            sleep 60
          done
          exit 1
      - name: Test the Android app
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest
      # If the tests fail: say why, right here in the log.
      - name: Show why the tests failed
        if: failure()
        working-directory: android-native
        run: |
          echo "--- the runtime folder:"; ls -la app/build/robolectric-runtime || true
          echo "--- what the tests reported:"
          grep -h -A6 "<failure" app/build/test-results/testDebugUnitTest/*.xml | head -60 || true
          echo "--- what Robolectric logged:"
          grep -h -i -B1 -A2 "unable to locate\|no such directory\|missing the dependency\|robolectric" app/build/test-results/testDebugUnitTest/*.xml | grep -v "^--$" | head -40 || true
      - name: Keep the screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: android-native/app/build/screens/
          if-no-files-found: ignore
